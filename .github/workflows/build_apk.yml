name: Build Mod APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Project
      run: unzip "07062025StandChillow_ESPFixAndUpdate.zip" -d .
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Build APK
      run: |
          cd 07062025StandChillow_ESPFixAndUpdate
        chmod +x gradlew
        ./gradlew assembleDebug 
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-APK
        path: path: "**/app/build/outputs/apk/debug/*.apk"
